name: PhotoKB
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant, ja, ko, tr, ar, ru, pt-BR, es, id, th, vi, de, fr, it, nl]
settings:
  base:
    APP_ID: com.hgsldswk.photokb
    APP_STORE_ID: "6837237983"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  PhotoKB:
    type: application
    platform: iOS
    sources: [PhotoKB, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PhotoKB AppStore
    info:
      path: PhotoKB/Info.plist
      properties:
        CFBundleDisplayName: 照片压缩到KB
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        NSPhotoLibraryAddUsageDescription: 将你确认导出的 JPEG 副本存到照片。
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.photokb.rule
            UTTypeDescription: Photo KB Rule
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [kbrule]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Photo KB Rule
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.photokb.rule]
        LSSupportsOpeningDocumentsInPlace: true
  PhotoKBTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PhotoKBTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  PhotoKBUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PhotoKBUITests]
    dependencies:
      - target: PhotoKB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhotoKB
schemes:
  PhotoKB:
    build:
      targets:
        PhotoKB: all
        PhotoKBTests: [test]
    test:
      config: Debug
      targets: [PhotoKBTests]
  PhotoKBUI:
    build:
      targets:
        PhotoKB: all
        PhotoKBUITests: [test]
    test:
      config: Debug
      targets: [PhotoKBUITests]
